outputs:
  tasks:
    - id: t-fd6e82
      title: 建立插件包骨架与配置层
      implements: "新增 package.json（type: module、dsh.bundle.patch 指向 ./cordis.patch.yml、不引第三方依赖）；新增 cordis.patch.yml 用 insert 写一条 id: dsh-notice-webhook 的装载行；新增 index.js 只导出 apply(ctx, config) 做接线；新增 src/config.js 提供 DEFAULTS 与 normalizeConfig（类型不符或越界回落默认值并写一条 warn）。"
      serves: []
      depends_on: []
      phase: implement
      side: backend
    - id: t-20c962
      title: 实现绑定表与原子持久化
      implements: 新增 src/bindings.js：BindingStore 以 Map 保存 sessionId→{url,updatedAt}；load() 读 $DSH_HOME/state/dsh-notice-webhook/bindings.json（文件缺失返回空表且不创建；非法 JSON 或未知 version 记 warn 并返回空表且不覆盖原文件；单条字段非法跳过）；persist() 先写 .tmp 再 rename 实现原子写；list() 按 sessionId 升序返回。
      serves: []
      depends_on:
        - t-fd6e82
      phase: implement
      side: backend
    - id: t-ae2996
      title: 暴露 Host Service dshNoticeWebhook
      implements: "新增 src/service.js：以 ctx.provide('dshNoticeWebhook', svc) 暴露 { version: 1, bind, unbind, list, resolve }；bind 校验 sessionId 为非空字符串、url 能被 new URL 解析且 protocol 属于 http:/https: 否则返回 false（不抛异常）；用 ctx.effect 在 apply 中注册并在卸载时释放。"
      serves: []
      depends_on:
        - t-20c962
      phase: implement
      side: backend
    - id: t-cbf2e4
      title: 实现 webhook 投递层
      implements: "新增 src/deliver.js：用 Node 内置 fetch 发 POST JSON（带 Content-Type: application/json; charset=utf-8 与 webhookHeaders）；用 AbortSignal.timeout(timeoutMs) 控制超时；redirect 设为 'manual' 且把 3xx 判定为失败；仅对网络错误、5xx、超时按 retry 次数重试，4xx 不重试；所有分支包 try/catch，失败只写 logger.warn，日志只输出 new URL(url).host 不输出完整 URL 与 headers。"
      serves: []
      depends_on:
        - t-fd6e82
      phase: implement
      side: backend
    - id: t-245978
      title: 实现事件分类与过滤
      implements: 新增 src/classify.js：把 session/event 分类成通知意图——turn/end 按标题拼正文、approval/asked 带 toolName、tool/call 且 name==='ask_user_question' 产出提问意图；用 WeakMap 缓存 session/title；实现 onlyTopLevel（存在 parentSession 或 origin==='subagent' 时跳过）、skipReasons、cooldownMs 三类过滤；未命中返回 null。
      serves: []
      depends_on:
        - t-fd6e82
      phase: implement
      side: backend
    - id: t-898417
      title: 实现 goal 自动轮识别与静默
      implements: 新增 src/goal.js 的自动轮部分：在 session/event 中记录每条 user/message 的 source.kind 是否为 'goal'，并维护「本 turn 是否出现过人工输入」标记；turn/end 到达时若本轮全部 user message 均为 goal 注入则返回静默（不产出意图），只要出现一条非 goal 的 user/message 就按人工轮放行。
      serves: []
      depends_on:
        - t-245978
      phase: implement
      side: backend
    - id: t-f94377
      title: 实现 goal 终态识别与去重
      implements: 在 src/goal.js 增加终态部分：监听 goal/change 更新当前 goal 的 {id, revision, phase, maxGoalRounds}；phase 变为 complete 时产出 goal/complete 意图；变为 blocked 时产出 goal/blocked 意图——blockedReason.code === 'round-limit' 时正文用「目标轮次耗尽（N/N）」且 N = maxGoalRounds，其他 code 用「目标阻塞（code）」；paused 与清除不产出；用 Set 按 goalId:revision:phase 做进程内去重。
      serves: []
      depends_on:
        - t-898417
      phase: implement
      side: backend
    - id: t-966bd3
      title: 实现路由层与总开关旁路
      implements: 新增 src/router.js：第一步应用类型开关（notifyComplete/notifyApproval/notifyQuestion）作内容级过滤，命中窗口绑定也不豁免；第二步解析目标地址——命中窗口绑定则无视 enabled 直接投递；未命中绑定且 enabled=false 时丢弃；未命中绑定且 enabled=true 时用 webhookUrl，为空则丢弃并写一条 debug 日志。
      serves: []
      depends_on:
        - t-ae2996
        - t-245978
      phase: implement
      side: backend
    - id: t-f25d34
      title: 接线整合与本地端到端联调
      implements: 在 index.js 组装主链路 classify → goal → router → deliver，用 ctx.on('session/event') 订阅会话事件，完成 service 注册与 bindings.load() 的调用顺序；新增 test/e2e.local.test.js：起本地 HTTP 接收端并按序灌入 turn/end、approval/asked、ask_user_question、goal/complete、goal/blocked，断言收到的 event 取值与正文；再把地址指向 http://127.0.0.1:1/ 重跑，断言无未捕获异常与未处理拒绝。
      serves: []
      depends_on:
        - t-cbf2e4
        - t-f94377
        - t-966bd3
      phase: implement
      side: fullstack
    - id: t-87cafa
      title: 装载到 profile 并做真实 Host 验收
      implements: 用 plugin_manager install_bundle 把插件包装进当前 profile 并确认生效；在真实 dsh 会话中触发一轮对话、一次需要授权的操作与一次 ask_user_question，用本地接收端日志逐条核对 payload 字段；再对某会话执行 bind() 到接收端 B 并设 enabled:false，验证只有 B 收到。
      serves: []
      depends_on:
        - t-f25d34
      phase: test
      side: backend
    - id: t-f01c88
      title: 处理迁移与兼容（旧数据 / 共存 / 回滚）
      implements: 固化 src/bindings.js 的读取降级路径（文件缺失、非法 JSON、未知 version、单条字段非法）；确认 payload 为追加式演进且 version 保持 1；验证与 dsh-notice 共存（不读写其配置与触发目录）；验证卸载回滚后除 bindings.json 外无残留；新增 test/compat.test.js 覆盖上述路径。
      serves: []
      depends_on:
        - t-20c962
      phase: implement
      side: backend
    - id: t-886615
      title: 写插件使用说明 README
      implements: 新增 README.md：写装载步骤（cordis.patch.yml 片段）、与 design/interfaces.md 一致的配置项表、webhook 契约与字段说明、Host Service 消费示例代码、本地接收端验证命令（python3 接收器与 curl 失败隔离两段）。
      serves: []
      depends_on:
        - t-87cafa
      phase: doc
      side: doc
