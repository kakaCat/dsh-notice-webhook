outputs:
  tasks:
    - id: t-3a35f9
      title: 声明插件 Config schema 与双半包清单
      implements: 在 package.json 增加依赖 @deepseek-ai/schemastery@3.18.4，并加 exports["./client"]=./client.js 与 dsh.client={platform:web,immediately:true,inject:[...]}；在 src/config.js 用 schemastery 声明 Config（enabled/timeoutMs/retry/cooldownMs/notifyComplete/notifyApproval/notifyQuestion/onlyTopLevel/includeTitle 标 .volatile()；webhookUrl 与文案/skipReasons 保持普通字段），保留 normalizeConfig 作为无 schema 时的兑底。验证：新增 test/config.test.js 并跑绿。
      serves: []
      depends_on: []
      phase: implement
      side: backend
    - id: t-be124b
      title: 实现渠道注册表与三国内渠道
      implements: 新增 src/channels/index.js：channel→adapter 注册表，未知渠道返回 {error} 不抛异常；新增 wecom.js（msgtype=markdown）、feishu.js（msg_type=text，可选 timestamp+sign 进 body）、dingtalk.js（msgtype=markdown，可选 timestamp+sign 进 query）；加签用 node:crypto 的 hmacSHA256；isSuccess 同时看 HTTP 状态与业务码。验证：新增 test/channels.cn.test.js。
      serves: []
      depends_on: []
      phase: implement
      side: backend
    - id: t-9a8084
      title: 实现 Slack / Discord / 通用三渠道
      implements: 新增 src/channels/slack.js（{text}）、discord.js（{content}，204/2xx 为成功）、custom.js（原样 v1 载荷 + target.headers 原样带上）；在 index.js 注册三者。验证：新增 test/channels.global.test.js（含 TC-5 老契约断言）。
      serves: []
      depends_on:
        - t-be124b
      phase: implement
      side: backend
    - id: t-13af87
      title: 实现目标清单存储与 CRUD
      implements: 新增 src/targets.js：TargetStore（load/bind…），路径 $DSH_HOME/state/dsh-notice-webhook/targets.json；字段校验（id 唯一、name 非空、url http(s)、events 仅受控取值、secretRef 仅 feishu/dingtalk）；写盘 tmp→rename；坏文件/未知 version 记 warn 且不覆盖。验证：新增 test/targets.test.js。
      serves: []
      depends_on: []
      phase: implement
      side: backend
    - id: t-f65a82
      title: 实现投递结果存储（内存）
      implements: 新增 src/outcomes.js：Map<targetId, Outcome[]>，append 时裁剪到 5 条；reason 只允许业务码/网络错误文本；提供 list(targetId) 与 snapshot()。验证：新增 test/outcomes.test.js。
      serves: []
      depends_on: []
      phase: implement
      side: backend
    - id: t-c9e09a
      title: 升级绑定存储：targetBindings 段
      implements: 在 src/bindings.js 增加 targetBindings 段（{ targetIds[], updatedAt }）；读时 targetBindings 优先，缺则回落 bindings url 映射；写时两段一起写（保旧版本可用）；提供 bindTargetsTargets/unbindTargets/listBindings 基础方法。验证：新增 test/bindings.v2.test.js（含“旧版本读新文件不报错”断言）。
      serves: []
      depends_on:
        - t-13af87
      phase: implement
      side: backend
    - id: t-3188ad
      title: 升级 Host Service 到 v2
      implements: 在 src/service.js 新增四方法并在 index.js 接线时注入 targets/outcomes；bindTargets 对不存在的 id 整笔返回 false；unbindTargets 清 targetBindings 并同时清旧 url 绑定；listTargets 不回密钥明文。验证：新增 test/service.v2.test.js。
      serves: []
      depends_on:
        - t-c9e09a
      phase: implement
      side: backend
    - id: t-792424
      title: 实现 RPC 只读端点与状态投影
      implements: 新增 src/rpc.js 并注册 GET /api/dsh-notice-webhook/state（沿用 Host 既有认证/信任域）；返回 targets（TargetView，secretRef 只给存在标记）、bindings（含展开的 targets）、defaults、outcomes、secrets、revision。验证：新增 test/rpc.read.test.js。
      serves: []
      depends_on:
        - t-3188ad
      phase: implement
      side: backend
    - id: t-b7a098
      title: 实现 RPC 写入端点与 revision 栅栏
      implements: 在 src/rpc.js 实现 POST /targets、/targets/delete、/test、/bind、/bindings/delete；每次写校验 revision（不符返回 409 + 最新状态），校验失败返回 400 且不落盘；成功返回新 revision。验证：新增 test/rpc.write.test.js。
      serves: []
      depends_on:
        - t-792424
      phase: implement
      side: backend
    - id: t-5a7d2f
      title: 实现目标集合解析与替代默认组
      implements: 在 src/router.js 实现 resolveTargets(sessionId, intent)：targetBindings 非空→只取这些（enabled 过滤，空则回落默认组）；否则取 isDefault && enabled；总开关仅作用默认组；输出目标集合供逐目标打包。验证：新增 test/router.resolve.test.js（含 TC-19 断言）。
      serves: []
      depends_on:
        - t-9a8084
        - t-c9e09a
      phase: implement
      side: backend
    - id: t-1146e7
      title: 实现逐目标过滤与去重
      implements: 在 src/router.js 增加逐目标 events 过滤（空数组=全收）与去重（同 channel+url 只保留一条）；与类开关的叠加顺序固定为：类开关→目标解析→总开关→目标过滤→去重。验证：新增 test/router.filter.test.js。
      serves: []
      depends_on:
        - t-5a7d2f
      phase: implement
      side: backend
    - id: t-10a822
      title: 接线主链路与 legacy 等价映射
      implements: 在 index.js 组装主链路并接入 channels；启动时把 legacy webhookUrl → 隐式 custom 默认目标、老 bindings url → 同地址目标（不重复建）；投递结果写入 outcomes。验证：新增 test/e2e.multi.test.js（含 TC-15 老配置兼容）。
      serves: []
      depends_on:
        - t-f65a82
        - t-b7a098
        - t-1146e7
      phase: implement
      side: fullstack
    - id: t-cefe17
      title: 客户端半：设置页骨架与目标页
      implements: 新增 client.js（window.__ModuleLoader__.load 格式，require('react')）；ctx.slots.inject('settings.section') 注册 {name,id:'dsh-notice-webhook',order:21,label:thunk}；实现 ChannelRail（含 6 渠道内联 SVG 图标与数量徽标）与 TargetCard 骨架，数据经 RPC GET /state。验证：打开设置页看 rail+卡片，控制台无报错；grep 命中 settings.section。
      serves: []
      depends_on:
        - t-b7a098
      phase: implement
      side: frontend
    - id: t-3f89ef
      title: 客户端半：目标编辑与动作
      implements: 在 client.js 实现表单（渠道切换时字段可见性变化）与动作：保存 POST /targets、删除 /targets/delete、启停开关（乐观更新+失败回滚）、发送测试 /test；错误行内展示，409 提示刷新并保留已填内容。验证：打开设置页操作并看行内错误与徽标变化。
      serves: []
      depends_on:
        - t-cefe17
      phase: implement
      side: frontend
    - id: t-6b4417
      title: 客户端半：事件过滤网格与全局开关
      implements: 在 client.js 实现 EventFilterGrid（四项，空=全收并显式提示）与 GlobalSwitches（总开关/超时/重试/冷却写入 volatile 配置）；保存后刷新状态。验证：界面勾选后 GET /state 比对 events；改全局开关后不重启触发一次通知看生效。
      serves: []
      depends_on:
        - t-cefe17
      phase: implement
      side: frontend
    - id: t-10999f
      title: 客户端半：会话绑定页与解绑
      implements: 在 client.js 实现会话绑定页：表格（会话标题+id 尾串 / 目标 chips / 解绑），悬空引用显示「目标已删除（回落默认组）」+ 清理；解绑二次确认后 POST /bindings/delete；409/404 口径与目标页一致。验证：界面解绑后 e2e 断言回落默认组。
      serves: []
      depends_on:
        - t-cefe17
      phase: implement
