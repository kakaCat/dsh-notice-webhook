      implements: 按 design/interfaces.md §2 实现 isJobRegistryLike() 与 createJobGate({logger, graceMs, clock, setTimer, clearTimer, deliver})，成员 attach/detach/noteTurnStart/gate/observe/pendingOf/dispose 与错误语义逐条对齐；判定式按 design/data-model.md §3（owner===sid、status∈{running,stopping}、startedAt>=最近 turn/start 三重过滤）；observe() 只认 settled/removed 且必须判 event?.job 存在（output 事件没有 job 字段）；所有异常吞掉 + warn。在 test/jobs-gate.test.js 建假 registry（list 返回副本 + 测试侧 settle/remove 助手）/假时钟/假计时器，并写判定层用例 TC-2、3、6、7、8、9、13、14。
      serves:
        - FR-1
        - FR-2
        - FR-3
      depends_on: []
      phase: implement
      side: backend
    - id: t-acae58
      title: 接线：主链路插入闸门 + ctx.inject(['jobs']) + 补发通路
      implements: index.js：createNotifier 接受可选 options.jobs/jobGraceMs/clock/timers 并建闸门，闸门的 deliver 接到 dispatch(session, intent, now, {prompt})；handle() 内 turn/start → gate.noteTurnStart(会话 id)，完成意图且非 goal 自动轮静默后再过闸门，抑制时返回 {action:'dropped', reason:'job-running', intent, jobIds}；deliverToTarget 改为 extra.prompt ?? prompts.take(session)（补发时该轮 prompt 已被 clear，必须用捕获值）；apply() 增 ctx.inject(['jobs'], jobCtx => jobCtx.effect(() => runtime.gate.attach(jobCtx.jobs)))，dispose 顺序为先注销监听与计时器再清状态；补接线层用例 TC-3/4/5/10/11/12/15/16/18/19。
      serves:
        - FR-1
        - FR-3
        - FR-4
        - FR-5
        - FR-6
      depends_on:
        - t-1c0dc2
        - t-30bbed
      phase: implement
      side: backend
