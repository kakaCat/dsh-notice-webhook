    - id: t-5e2101
      title: 分类契约：turn/end 终态决策表（纯函数）
      implements: src/classify.js：新增冻结常量 KNOWN_TURN_KINDS（7 种终态）、INTENT_INTERRUPT='interrupt'、EVENT_TURN_ERROR='turn/error'；新增纯函数 decideTurnEnd(reason, skipReasons)（按 design/architecture.md §1 的 7 行顺序：静默名单→completed→error→interrupted→aborted→未知 kind→其余；reason.kind 非字符串/空 → 'unknown'，长度>40 截断）、silentReasonOf()、errorFacts()（code 缺省 UNKNOWN，message 单行化+slice(0,200)）；Classifier.classify() 的 turn/end 分支改为查表并组装中断意图 {kind:'interrupt', event:'turn/error', message, toolName:null, reason, error}；不得保留任何『默认当完成』兜底分支。
      serves:
        - FR-1
        - FR-2
      depends_on: []
      phase: implement
      side: backend
    - id: t-a36090
      title: 数据契约：目标事件语义 eventsMode 与事件清单
      implements: src/targets.js：EVENT_TYPES 追加 'turn/error'（既有四项顺序不变）；新增 LEGACY_ALL_EVENTS 与纯函数 normalizeEvents(events, mode)（判定式按 design/data-model.md §2，幂等）；validateTarget() 读取 input.eventsMode（值域 all/explicit，其它视为缺省）、未知事件仍按既有规则报错、输出补 eventsMode；TargetStore.#persist() 与版本闸门零改动（TARGET_FILE_VERSION 保持 3）。
      serves:
        - FR-5
      depends_on: []
      phase: implement
      side: backend
    - id: t-413c55
      title: 接线：开关、类型过滤与静默留痕
      implements: src/config.js 五处登记（DEFAULTS.notifyInterrupt=true / interruptMessage='会话异常中断' / skipReasons=['aborted']、BOOLEAN_KEYS、STRING_KEYS、schema、VOLATILE_KEYS）；src/router.js 的 isTypeDisabled() 与废弃 route() 两处加 notifyInterrupt===false 分支，targetAccepts() 按 eventsMode 判定（explicit 严格白名单、all 全收、缺省逐字保持旧口径）；index.js 的 handle() 在 intent===null 时改走 silentReasonOf() + debug 日志 + 返回 {action:'dropped', reason, turnKind}，autoRound 静默分支逐字不动（只对完成意图生效）。
      serves:
        - FR-1
        - FR-4
        - FR-6
      depends_on:
        - t-5e2101
        - t-a36090
      phase: implement
      side: backend
    - id: t-5cbf4c
      title: 出站报文：中断意图的 reason / error 与事件元数据
      implements: "src/channels/custom.js 的 buildPayload() 仅当 intent.kind==='interrupt' 时追加 reason: intent.reason 与 error: intent.error ?? null（非中断事件键集合逐字节不变）；src/payload.js 的 EVENT_META 增 'turn/error': { title:'⚠️ 会话中断', color:'red' }；五个渠道适配器零改动。"
      serves:
        - FR-2
        - FR-3
      depends_on:
        - t-5e2101
      phase: implement
      side: backend
    - id: t-ca1e16
      title: 前端：设置页「关心事件」与保存语义
      implements: "client.js：EVENTS 在「对话完成」之后插入 { id:'turn/error', label:'会话中断', field:'turn/error' }；save() 计算 allChecked（勾选集合 == EVENT_IDS）→ 全勾提交 {events: [], eventsMode:'all'}，否则提交 {events: 勾选, eventsMode:'explicit'}；selectTarget() 回显口径不变（events 空 = 全勾）。不改布局/样式/图标/renderTargetPicker 契约。"
