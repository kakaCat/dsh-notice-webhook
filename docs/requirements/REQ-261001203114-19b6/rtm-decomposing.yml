      implements: 锁定三条路径：① 老记录（events 恰为 LEGACY_ALL_EVENTS 且无 mode）载入后归一化为 {events:[],eventsMode:'all'}，老目标开箱即收中断；② 老客户端（提交显式四项、无 mode）推断为全收；③ 旧版本读新文件：按白名单只取已知字段、忽略 eventsMode、events:[] 在旧语义里同样是全收，version 仍为 3。结果写入 docs/requirements/REQ-261001203114-19b6/tests/compat-report.md。
